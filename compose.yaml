services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: testpilot_db
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD: testpilot
    ports:
      - "5432:5432"
    volumes:
      - testpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpilot -d testpilot_db"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  testpilot-postgres:
