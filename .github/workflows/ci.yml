name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  orchestrator:
    name: LangGraph workflow tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.lock

      - name: Install exact dependencies
        run: python -m pip install -r requirements.lock

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Test checkpointed workflows
        run: python -m pytest

  evaluation:
    name: Phase 7 benchmark regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test evaluation metrics and dataset pin
        run: python -m unittest discover -s evaluation/tests -v

      - name: Run pinned offline benchmark and enforce thresholds
        run: >-
          python evaluation/run_evaluation.py --check
          --output /tmp/testpilot-phase7-results.json
          --report /tmp/testpilot-phase7-results.md

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-benchmark-results
          path: |
            /tmp/testpilot-phase7-results.json
            /tmp/testpilot-phase7-results.md
          if-no-files-found: warn

  worker-isolation:
    name: Worker isolation contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build non-root worker image
        run: docker build --tag testpilot-worker:ci --file worker/Dockerfile .

      - name: Verify worker restrictions
        run: >-
          docker run --rm
          --user 10001:10001
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --pids-limit 32
          --memory 256m
          --cpus 0.5
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m
          testpilot-worker:ci
          testpilot-isolation-probe

  pgvector:
    name: PostgreSQL pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: testpilot_db
          POSTGRES_USER: testpilot
          POSTGRES_PASSWORD: testpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testpilot -d testpilot_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify pgvector storage and scoped hybrid retrieval
        env:
          TEST_PGVECTOR: "true"
          DB_URL: jdbc:postgresql://localhost:5432/testpilot_db
          DB_USERNAME: testpilot
          DB_PASSWORD: testpilot
          JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes
          WORKFLOW_INTERNAL_TOKEN: ci-only-workflow-token-at-least-32-bytes
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=PgVectorIntegrationTest test

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
