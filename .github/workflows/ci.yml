name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload snapshot retrieval and citation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-context-evidence
          path: target/phase6-context-evidence.json
          if-no-files-found: warn

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  orchestrator:
    name: LangGraph workflow tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.lock

      - name: Install exact dependencies
        run: python -m pip install -r requirements.lock

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Test checkpointed workflows
        run: python -m pytest

  evaluation:
    name: Retrieval and evaluation regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test evaluation metrics and dataset pin
        run: python -m unittest discover -s evaluation/tests -v

      - name: Run pinned offline benchmark and enforce thresholds
        run: >-
          python evaluation/run_evaluation.py --check
          --output /tmp/testpilot-phase7-results.json
          --report /tmp/testpilot-phase7-results.md

      - name: Verify reviewer metrics against pinned annotated fixtures
        run: python evaluation/phase6/reviewer_quality.py --fixture-check --output /tmp/phase6-review-quality.json

      - name: Upload reviewer metric regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-review-quality
          path: /tmp/phase6-review-quality.json
          if-no-files-found: warn

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-benchmark-results
          path: |
            /tmp/testpilot-phase7-results.json
            /tmp/testpilot-phase7-results.md
          if-no-files-found: warn

  worker-isolation:
    name: Offline polyglot execution and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test bounded worker parsers and commands
        run: python -m unittest discover -s worker/polyglot -p 'test_*.py' -v

      - name: Build the application execution image
        run: docker build --tag testpilot-polyglot:ci --file worker/polyglot/Dockerfile .

      - name: Verify languages, outcomes, timeout and isolation in real containers
        run: python worker/polyglot/smoke.py --image testpilot-polyglot:ci --output /tmp/phase4-container-evidence.json

      - name: Measure authored strong and vacuous tests against seeded defects
        run: python evaluation/phase6/test_usefulness.py --image testpilot-polyglot:ci --output /tmp/phase6-usefulness.json

      - name: Upload test usefulness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-usefulness
          path: /tmp/phase6-usefulness.json
          if-no-files-found: warn

      - name: Set up Java 17 for real executor integration
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify application executor and cancellation against Docker
        env:
          TEST_REAL_CONTAINER: 'true'
          TEST_SECURE_WORKER_IMAGE: testpilot-polyglot:ci
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=RealContainerExecutionTest test

      - name: Upload container acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-container-evidence
          path: /tmp/phase4-container-evidence.json
          if-no-files-found: warn

  pgvector:
    name: PostgreSQL pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: testpilot_db
          POSTGRES_USER: testpilot
          POSTGRES_PASSWORD: testpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testpilot -d testpilot_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify pgvector storage and scoped hybrid retrieval
        env:
          TEST_PGVECTOR: "true"
          DB_URL: jdbc:postgresql://localhost:5432/testpilot_db
          DB_USERNAME: testpilot
          DB_PASSWORD: testpilot
          JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes
          WORKFLOW_INTERNAL_TOKEN: ci-only-workflow-token-at-least-32-bytes
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=PgVectorIntegrationTest test

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
