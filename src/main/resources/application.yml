spring:
  application:
    name: testpilot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

---
# PostgreSQL / Dev profile configuration
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testpilot_db}
    username: ${DB_USERNAME:testpilot}
    password: ${DB_PASSWORD:testpilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

ai:
  provider: ${AI_PROVIDER:mock}
  embedding-provider: ${AI_EMBEDDING_PROVIDER:mock}
  embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
  embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}

testpilot:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${BOOTSTRAP_ADMIN_NAME:TestPilot Administrator}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  github:
    api-base: ${GITHUB_API_BASE:https://api.github.com}
    app-id: ${GITHUB_APP_ID:}
    app-slug: ${GITHUB_APP_SLUG:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    mcp:
      endpoint: ${GITHUB_MCP_ENDPOINT:https://api.githubcopilot.com/mcp/}
      token: ${GITHUB_MCP_TOKEN:}
      allowed-repositories: ${GITHUB_MCP_ALLOWED_REPOSITORIES:}
  workflow:
    orchestrator-base-url: ${LANGGRAPH_ORCHESTRATOR_URL:http://localhost:8090}
    internal-token: ${WORKFLOW_INTERNAL_TOKEN:}
  execution:
    backend: ${TEST_EXECUTION_BACKEND:container}
    worker-image: ${TEST_WORKER_IMAGE:testpilot-worker:local}
    dependency-network: ${TEST_DEPENDENCY_NETWORK:bridge}
    timeout-seconds: ${TEST_EXECUTION_TIMEOUT_SECONDS:60}
    await-seconds: ${TEST_EXECUTION_AWAIT_SECONDS:240}
    lease-seconds: ${TEST_EXECUTION_LEASE_SECONDS:30}
    max-attempts: ${TEST_EXECUTION_MAX_ATTEMPTS:3}
    memory-limit: ${TEST_EXECUTION_MEMORY:1g}
    cpu-limit: ${TEST_EXECUTION_CPUS:1.0}
    pid-limit: ${TEST_EXECUTION_PIDS:128}
    recovery-enabled: ${TEST_EXECUTION_RECOVERY_ENABLED:true}
    mutation-enabled: ${TEST_MUTATION_ENABLED:false}
  rag:
    vector-store: ${RAG_VECTOR_STORE:pgvector}
    ingestion-version: ${RAG_INGESTION_VERSION:rag-v2}
    relevance-threshold: ${RAG_RELEVANCE_THRESHOLD:0.08}
    token-budget: ${RAG_TOKEN_BUDGET:6000}

server:
  port: ${PORT:8080}
