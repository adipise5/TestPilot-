spring:
  datasource:
    url: jdbc:h2:mem:testpilot_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-only-secret-that-is-at-least-32-bytes-long

testpilot:
  security:
    h2-console-enabled: true
  workflow:
    internal-token: ${WORKFLOW_INTERNAL_TOKEN:test-only-workflow-token-at-least-32-bytes}
  execution:
    backend: container
    recovery-enabled: false
  rag:
    vector-store: memory
